<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B3122E">
<title>자료 준비 중 | 경기대학교 중어중문전공</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    --crimson: #B3122E;
    --crimson-deep: #7E0A1F;
    --gold: #F2C14E;
    --navy: #14234B;
    --paper: #FFF8EC;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.75rem;
    padding: calc(2rem + env(safe-area-inset-top, 0px)) 1.5rem calc(2rem + env(safe-area-inset-bottom, 0px));
    background:
      radial-gradient(circle at 50% 38%, rgba(242,193,78,.18) 0 22%, transparent 60%),
      radial-gradient(rgba(126,10,31,.55) 1.2px, transparent 1.4px) 0 0 / 9px 9px,
      var(--crimson);
    color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    text-align: center;
  }
  .dept {
    margin: 0;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--gold);
  }
  .bubble {
    position: relative;
    max-width: 22rem;
    margin: 0;
    padding: 1.6rem 1.8rem;
    background: #fff;
    color: var(--navy);
    border: 4px solid var(--navy);
    border-radius: 2.2rem;
    box-shadow: 7px 7px 0 var(--navy);
    font-family: "Black Han Sans", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-weight: 400;
    font-size: clamp(1.9rem, 8.5vw, 2.6rem);
    line-height: 1.25;
    word-break: keep-all;
    text-wrap: balance;
    animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 22%;
    bottom: -26px;
    width: 34px;
    height: 34px;
    background: #fff;
    border-right: 4px solid var(--navy);
    border-bottom: 4px solid var(--navy);
    transform: skewY(28deg) rotate(38deg);
  }
  .guide {
    margin: .6rem 0 0;
    max-width: 20rem;
    font-size: 1.05rem;
    line-height: 1.6;
    word-break: keep-all;
    text-wrap: balance;
  }
  .code {
    margin: 0;
    padding: .25rem .8rem;
    border: 1.5px solid rgba(242,193,78,.7);
    border-radius: 999px;
    font-size: .85rem;
    font-weight: 700;
    color: var(--gold);
  }
  @keyframes pop {
    from { transform: scale(.85); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble { animation: none; }
  }
</style>
</head>
<body>
  <p class="dept">경기대학교 중어중문전공</p>
  <h1 class="bubble">자료를 준비하고 있습니다</h1>
  <p class="guide">궁금한 점은 중어중문전공 부스에서 바로 물어보세요.</p>
  <p class="code">QR 3</p>
</body>
</html>
