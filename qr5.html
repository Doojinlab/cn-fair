<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#001850">
<title>e-Cargoway Logistics | 중국과 세계를 잇는 종합물류</title>
<meta name="description" content="이카고웨이 로지스틱스 소개 애니메이션. 1998년 칭다오에서 첫 지점을 열고 중국 9개 도시와 서울, 베트남, 미국을 잇는 종합물류 기업입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&amp;family=Big+Shoulders+Stencil+Display:wght@700;800&amp;family=Noto+Serif+SC:wght@600;900&amp;display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --navy:#001850;--navy2:#0a2b6e;--deep:#000f36;--sky:#0098d8;--sky2:#62c6ef;
  --paper:#f2f5f8;--ink:#0b1b3a;--mink:#56637b;--rule:#c8d1dd;--seal:#d8232a;--fg:#eaf2fb;
  --f-kr:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-code:"Big Shoulders Stencil Display","Big Shoulders Stencil","Arial Narrow","Roboto Condensed",sans-serif;
  --f-zh:"Noto Serif SC","Noto Serif CJK SC","Songti SC","STSong","SimSun",serif;
  --f-zhs:"PingFang SC","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",sans-serif;
  --e-out:cubic-bezier(.16,1,.3,1);
  --e-snap:cubic-bezier(.77,0,.18,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--navy);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--navy);color:var(--fg);font-family:var(--f-kr);font-size:16px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
svg{display:block}
:focus-visible{outline:3px solid var(--sky2);outline-offset:3px}

/* ───── 무대 ───── */
.stage{position:relative;overflow:hidden;isolation:isolate;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:540px;background:var(--navy);color:var(--fg);touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.boot{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--sky);animation:boot .7s ease-in-out infinite alternate}
.stage.ready .boot{display:none}
@keyframes boot{to{transform:scale(1.9);opacity:.35}}
.scenes{position:absolute;inset:0}
.prog{position:absolute;z-index:30;top:12px;left:16px;right:16px;display:flex;gap:4px;pointer-events:none}
.seg{position:relative;flex:1;height:3px;border-radius:2px;overflow:hidden}
.seg::before{content:"";position:absolute;inset:0;background:currentColor;opacity:.28}
.seg i{position:absolute;inset:0;background:currentColor;transform:scaleX(0);transform-origin:left center}
.top{position:absolute;z-index:30;top:26px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.brand{line-height:1.3}
.brand b{display:block;font-family:var(--f-code);font-size:19px;font-weight:800;letter-spacing:.02em}
.brand span{display:block;font-size:11.5px;opacity:.82}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.ibtn{pointer-events:auto;flex:none;width:42px;height:42px;padding:0;border-radius:50%;border:1.5px solid currentColor;background:transparent;display:grid;place-items:center}
.ibtn svg{width:17px;height:17px}
.ibtn[hidden]{display:none}
.ibtn.snd .lbl{display:none}
.ibtn.snd.cta{width:auto;padding:0 15px 0 12px;gap:6px;border-radius:999px;display:inline-flex;align-items:center;background:var(--sky);border-color:var(--sky);color:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.ibtn.snd.cta .lbl{display:inline}
@media (max-width:359px){.ibtn.snd.cta{width:42px;padding:0;justify-content:center}.ibtn.snd.cta .lbl{display:none}}
.foot{position:absolute;z-index:30;left:16px;right:16px;bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none;font-size:12px}
.hint{opacity:.82;transition:opacity .6s}
.hint.off{opacity:0}
.cue{pointer-events:auto;flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 15px;border:1.5px solid currentColor;border-radius:999px;font-weight:700;text-decoration:none;white-space:nowrap}
.cue svg{width:14px;height:14px}
.holdflag{position:absolute;z-index:31;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(0,10,30,.5);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.7);transition:opacity .15s,transform .2s var(--e-spring);pointer-events:none}
.holdflag svg{width:26px;height:26px}
.stage.held .holdflag{opacity:1;transform:none}

/* ───── 장면: 골판 컨테이너 벽 ───── */
.scene{position:absolute;inset:0;overflow:hidden;visibility:hidden;background:var(--sbg,var(--navy));color:var(--fg)}
.scene::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,rgba(255,255,255,0) 3px 14px,rgba(0,0,0,.13) 14px 17px,rgba(0,0,0,0) 17px 28px)}
.scene.on,.scene.was{visibility:visible}
.scene.was{z-index:1}
.scene.on{z-index:2}
.scene.on.in{animation:beltIn .6s cubic-bezier(.65,0,.35,1) both}
.scene.on.back{animation:beltBack .6s cubic-bezier(.65,0,.35,1) both}
@keyframes beltIn{0%{transform:translateX(100%)}80%{transform:translateX(-1.4%)}100%{transform:none}}
@keyframes beltBack{0%{transform:translateX(-100%)}80%{transform:translateX(1.4%)}100%{transform:none}}
.mark{position:absolute;right:3vw;bottom:9vh;font-family:var(--f-code);font-weight:800;font-size:min(15vw,19vh);line-height:.9;letter-spacing:.02em;color:rgba(255,255,255,.07);white-space:nowrap;pointer-events:none}
.bigzh{position:absolute;top:50%;right:-.04em;transform:translateY(-50%);font-family:var(--f-zh);font-weight:900;font-size:min(46vw,36vh);line-height:1;writing-mode:vertical-rl;color:transparent;-webkit-text-stroke:1.5px rgba(234,242,251,.16);pointer-events:none}
.fit{position:absolute;top:84px;bottom:66px;left:20px;right:20px;display:flex;flex-direction:column;justify-content:center;gap:calc(18px*var(--k));--k:1;overflow:hidden}
.col{display:flex;flex-direction:column;gap:calc(14px*var(--k));min-width:0}
@media (min-width:900px){
  .prog{top:16px;left:32px;right:32px}
  .top{top:32px;left:32px;right:32px}
  .foot{left:32px;right:32px;bottom:24px;font-size:13px}
  .fit{top:108px;bottom:88px;left:7vw;right:7vw}
  .fit.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);column-gap:5vw;align-items:center;align-content:center}
  .bigzh{font-size:min(30vw,40vh)}
}

/* 등장 모션 */
.a{opacity:0}
.scene.was .a{opacity:1;transform:none;animation:none;clip-path:none}
.scene.on .a{animation-duration:var(--du,.6s);animation-timing-function:var(--e-out);animation-fill-mode:both;animation-delay:var(--d,0s)}
.scene.on .up{animation-name:up}
.scene.on .sl{animation-name:sl}
.scene.on .fd{animation-name:fd}
.scene.on .rise{animation-name:rise;--du:1s}
.scene.on .pop{animation-name:pop;animation-timing-function:var(--e-spring);--du:.5s}
.scene.on .drop{animation-name:drop;--du:.5s}
.scene.on .slap{animation-name:slap;--du:.45s;animation-timing-function:cubic-bezier(.3,1.4,.5,1)}
.scene.on .prt{animation-name:prt;animation-timing-function:steps(12,end)}
.scene.on .stampin{animation-name:stampin;--du:.32s;animation-timing-function:cubic-bezier(.55,0,.6,1.35)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes sl{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14%)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-40%)}to{opacity:1;transform:none}}
@keyframes slap{0%{opacity:0;transform:translateY(-36px) scale(1.2) rotate(-7deg)}55%{opacity:1;transform:scale(.97) rotate(calc(var(--rot,0deg) + .8deg))}100%{opacity:1;transform:rotate(var(--rot,0deg))}}
@keyframes prt{from{opacity:1;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes stampin{0%{opacity:0;transform:scale(2.5) rotate(-24deg)}70%{opacity:1;transform:scale(.93) rotate(calc(var(--rot,-8deg) - 1deg))}100%{opacity:1;transform:rotate(var(--rot,-8deg))}}

/* 공통 글자 */
.h{margin:0;font-weight:700;letter-spacing:-.035em;line-height:1.14;font-size:calc(clamp(30px,8.4vw,48px)*var(--k))}
.h>span{display:block}
.lede{margin:0;max-width:30em;font-size:calc(15px*var(--k));line-height:1.7;color:rgba(234,242,251,.84)}
.code{font-family:var(--f-code);font-weight:800;letter-spacing:.02em}
.zh{font-family:var(--f-zh)}
@media (min-width:900px){
  .h{font-size:calc(min(4.4vw,7.6vh,78px)*var(--k))}
  .lede{font-size:calc(min(1.3vw,2.3vh,19px)*var(--k))}
}

/* 0 인트로: 송장 라벨 */
.label{position:relative;width:min(100%,calc(390px*var(--k)));background:var(--paper);color:var(--ink);border-radius:10px;padding:calc(14px*var(--k)) calc(16px*var(--k)) calc(12px*var(--k));box-shadow:0 18px 40px rgba(0,0,0,.38);--rot:-2deg;transform:rotate(var(--rot))}
.lb-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:calc(8px*var(--k));border-bottom:2px solid var(--ink)}
.lb-top b{font-family:var(--f-code);font-weight:800;font-size:calc(25px*var(--k));letter-spacing:.02em;line-height:1}
.lb-top span{font-size:calc(11.5px*var(--k));font-weight:600;color:var(--mink)}
.lb-f{display:grid;grid-template-columns:1fr auto;gap:calc(8px*var(--k)) 14px;margin:calc(10px*var(--k)) 0}
.lb-f div{min-width:0}
.lb-f .w{grid-column:1 / -1}
.lb-f dt{font-size:calc(10.5px*var(--k));font-weight:600;color:var(--mink)}
.lb-f dd{margin:0;font-weight:700;font-size:calc(17px*var(--k));line-height:1.35}
.lb-f dd.code{font-size:calc(24px*var(--k));line-height:1.05}
.bc{position:relative;height:calc(50px*var(--k));overflow:hidden}
.bc svg{width:100%;height:100%;fill:var(--ink)}
.laser{position:absolute;left:-4%;right:-4%;top:0;height:2px;background:var(--seal);box-shadow:0 0 10px 3px rgba(216,35,42,.65);opacity:0}
.scene.on .laser{animation:laser .5s 1.35s ease-in-out both}
@keyframes laser{0%{opacity:0;top:0}15%{opacity:1}85%{opacity:1}100%{opacity:0;top:100%}}
.lb-no{display:flex;justify-content:space-between;margin-top:calc(6px*var(--k));font-family:var(--f-code);font-weight:700;font-size:calc(15px*var(--k));letter-spacing:.08em}

/* 1 지점망 지도 */
.map{position:relative;width:100%;height:calc(min(50vh,560px)*var(--k))}
.map svg{width:100%;height:100%;overflow:visible}
@media (min-width:900px){.map{height:calc(min(68vh,660px)*var(--k))}}
.grat{fill:none;stroke:rgba(234,242,251,.09);stroke-width:.35;stroke-dasharray:1.6 1.6}
.sea{font-family:var(--f-zh);font-size:6px;font-weight:600;fill:rgba(234,242,251,.16);letter-spacing:.35em}
.rt{fill:none;stroke:var(--sky2);stroke-width:1.1;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.scene.on .rt{animation:draw .45s var(--e-out) both;animation-delay:var(--d)}
.scene.was .rt{stroke-dashoffset:0}
@keyframes draw{to{stroke-dashoffset:0}}
.nd{transform-box:fill-box;transform-origin:center;opacity:0}
.scene.on .nd{animation:pop .5s var(--e-spring) both;animation-delay:var(--d)}
.scene.was .nd{opacity:1}
.nd circle{fill:#fff}
.nd.kr circle{fill:var(--sky2)}
.nd .ring{fill:none;stroke:var(--sky2);stroke-width:.7}
.nd text{paint-order:stroke;stroke:var(--navy);stroke-width:2.6px;stroke-linejoin:round}
.nd .cz{font-family:var(--f-zh);font-weight:900;font-size:7.6px;fill:#fff}
.nd .ck{font-family:var(--f-kr);font-weight:600;font-size:5.4px;fill:rgba(234,242,251,.78)}
.nd.origin .cz{font-size:12px;fill:var(--sky2)}
.nd.origin .cy{font-family:var(--f-code);font-weight:800;font-size:9px;fill:#fff;letter-spacing:.04em}
.scene.on .nd.origin .ring{animation:ripple 1.6s .35s ease-out 3 both}
@keyframes ripple{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
.nd .ring{transform-box:fill-box;transform-origin:center}

/* 2–6 사업 영역 */
.svc-h{display:flex;flex-direction:column}
.hz{font-family:var(--f-zh);font-weight:900;line-height:1;font-size:calc(min(29vw,17vh,220px)*var(--k));letter-spacing:-.01em;color:#fff;margin-left:-.04em}
.py{margin-top:calc(8px*var(--k));font-family:var(--f-zh);font-weight:600;font-size:calc(18px*var(--k));opacity:.92}
.nm{margin:calc(2px*var(--k)) 0 0;font-weight:700;font-size:calc(clamp(26px,7vw,40px)*var(--k));letter-spacing:-.03em;line-height:1.2}
.fact{margin:0;display:flex;align-items:baseline;gap:10px;font-weight:600;font-size:calc(15.5px*var(--k));line-height:1.5}
.fact .code{font-size:calc(26px*var(--k));line-height:1}
.vis{position:relative;width:100%;height:calc(min(24vh,230px)*var(--k))}
@media (min-width:900px){.vis{height:calc(min(30vh,300px)*var(--k))}.hz{font-size:calc(min(15vw,26vh,250px)*var(--k))}}
.ticket{position:relative;align-self:flex-start;width:min(100%,calc(340px*var(--k)));background:var(--paper);color:var(--ink);padding:calc(11px*var(--k)) calc(15px*var(--k)) calc(14px*var(--k));border-radius:4px 4px 0 0;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:7px;background:radial-gradient(circle at 5px 0,var(--paper) 4.6px,transparent 5px) 0 0/10px 7px repeat-x}
.tk-h{display:flex;justify-content:space-between;gap:10px;font-size:calc(11px*var(--k));font-weight:600;color:var(--mink)}
.tk-h .zh{font-weight:600}
.tk-zh{margin-top:calc(4px*var(--k));font-family:var(--f-zh);font-weight:900;font-size:calc(27px*var(--k));line-height:1.25}
.tk-py{font-family:var(--f-zh);font-size:calc(14px*var(--k));color:#1d4f93}
.tk-ko{margin-top:calc(2px*var(--k));font-size:calc(14px*var(--k));font-weight:600}

/* 항공 */
.runway{position:absolute;left:0;right:0;bottom:6%;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.85) 0 26px,transparent 26px 46px)}
.pl{position:absolute;left:2%;bottom:9%;width:calc(150px*var(--k));fill:#fff;opacity:0}
.scene.on .pl{animation:takeoff 2.6s .3s cubic-bezier(.55,0,.7,1) both}
@keyframes takeoff{0%{opacity:0;transform:translate(-40%,0)}8%{opacity:1}42%{transform:translate(55%,0) rotate(0)}58%{transform:translate(95%,-14%) rotate(-9deg)}100%{opacity:1;transform:translate(340%,-190%) rotate(-17deg)}}
/* 해상 */
.waves{position:absolute;left:-10%;right:-10%;bottom:0;height:34%;overflow:hidden}
.waves svg{position:absolute;left:0;width:200%;height:100%;fill:none;stroke:rgba(255,255,255,.55);stroke-width:2.2}
.waves svg+svg{opacity:.5;transform:translateY(22%)}
.scene.on .waves svg{animation:wave 3.2s linear infinite}
.scene.on .waves svg+svg{animation-duration:4.4s;animation-direction:reverse}
@keyframes wave{to{translate:-50% 0}}
.ship{position:absolute;left:0;bottom:16%;width:calc(230px*var(--k))}
.scene.on .ship{animation:sail 3.9s .1s linear both}
.ship svg{width:100%}
.scene.on .ship svg{animation:bob 1.3s ease-in-out infinite alternate}
@keyframes sail{from{transform:translateX(-80%)}to{transform:translateX(150%)}}
@keyframes bob{from{transform:translateY(0) rotate(-.6deg)}to{transform:translateY(5px) rotate(.8deg)}}
/* 육상 */
.road{position:absolute;left:-5%;right:-5%;bottom:8%;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.8) 0 30px,transparent 30px 54px)}
.scene.on .road{animation:roadrun .45s .1s linear 3 both}
@keyframes roadrun{to{background-position:-54px 0}}
.truck{position:absolute;left:4%;bottom:11%;width:calc(250px*var(--k))}
.scene.on .truck{animation:drive 1.35s .1s cubic-bezier(.2,.7,.25,1) both}
@keyframes drive{from{transform:translateX(-180%)}to{transform:none}}
.truck .wl{transform-box:fill-box;transform-origin:center}
.scene.on .truck .wl{animation:spin .45s .1s linear 3}
@keyframes spin{to{transform:rotate(360deg)}}
/* 통관 */
.cdoc{position:absolute;left:4%;top:4%;width:min(84%,calc(300px*var(--k)));height:88%;background:var(--paper);color:var(--ink);border-radius:4px;padding:calc(12px*var(--k)) calc(14px*var(--k));box-shadow:0 12px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:calc(7px*var(--k))}
.cdoc b{font-family:var(--f-zh);font-weight:900;font-size:calc(19px*var(--k));line-height:1.1}
.cdoc span{font-size:calc(11px*var(--k));color:var(--mink);font-weight:600;margin-top:-4px}
.cdoc i{display:block;height:calc(7px*var(--k));border-radius:2px;background:#d7dee8}
.cdoc i:nth-of-type(2){width:72%}.cdoc i:nth-of-type(3){width:86%}.cdoc i:nth-of-type(4){width:58%}
.scene.on .cdoc.hitme{animation:docin .5s .15s var(--e-out) both,shake .26s .92s ease-out}
@keyframes docin{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes shake{30%{transform:translate(2px,3px)}60%{transform:translate(-2px,-1px)}}
.stamp{position:absolute;right:8%;bottom:10%;width:calc(118px*var(--k));aspect-ratio:1;border:calc(5px*var(--k)) solid var(--seal);border-radius:50%;color:var(--seal);display:flex;flex-direction:column;align-items:center;justify-content:center;--rot:-12deg;mix-blend-mode:multiply}
.stamp b{font-family:var(--f-zh);font-weight:900;font-size:calc(36px*var(--k));line-height:1;color:var(--seal)}
.stamp small{font-family:var(--f-code);font-weight:800;font-size:calc(13px*var(--k));letter-spacing:.14em}
/* 창고 */
.whs{position:absolute;left:4%;bottom:6%;width:min(86%,calc(330px*var(--k)));height:92%}
.whs svg{position:absolute;inset:0;width:100%;height:100%}
.door{position:absolute;left:22%;right:22%;bottom:0;height:58%;overflow:hidden;background:#3b1f12}
.boxes{position:absolute;left:8%;right:8%;bottom:0;height:100%}
.bx{position:absolute;bottom:0;width:38%;height:34%;background:#d9a066;border:2px solid #8a5a2b;opacity:0}
.bx::after{content:"";position:absolute;left:44%;width:12%;top:0;bottom:0;background:#b9814a}
.bx.b1{left:4%}.bx.b2{left:52%}.bx.b3{left:28%;bottom:34%}
.scene.on .bx{animation:boxdrop .35s cubic-bezier(.5,0,.75,0) both,boxland .18s ease-out both;animation-delay:var(--d),calc(var(--d) + .33s)}
@keyframes boxdrop{from{opacity:0;transform:translateY(-200%)}to{opacity:1;transform:none}}
@keyframes boxland{0%{transform:scaleY(.86)}100%{transform:none}}
.shutter{position:absolute;inset:0;background:repeating-linear-gradient(180deg,#c9d2dc 0 9px,#9aa6b4 9px 11px)}
.scene.on .shutter{animation:rollup .8s .25s cubic-bezier(.5,0,.4,1) both}
@keyframes rollup{to{transform:translateY(-102%)}}

/* 7 대화 */

      ping(t, f, .26, .1, d); ping(t, f * 2.756, .05, .03, d); if (!i) ping(t, f / 2, .24, .3, d);
      duck(t, .75, .4);
    },
    /* 노선이 그려지는 '슝' */
    zip(t) {
      const d = bus(.05), bp = F('bandpass', 900, 2), g = G();
      bp.frequency.setValueAtTime(900, t); bp.frequency.exponentialRampToValueAtTime(4200, t + .28 / SP);
      env(g.gain, t, [[.2 / SP, .12], [.3 / SP, 0]]); W(NZ(t, .32 / SP), bp, g, d);
    },
    /* 항공: 활주로를 달려 이륙하는 제트음(왼쪽→오른쪽) */
    jet(t, du = 2.6) {
      du /= SP;
      const p = P(-.8); W(p, sfxB); W(p, G(.14), sfxRv);
      if (p.pan) { p.pan.setValueAtTime(-.8, t); p.pan.linearRampToValueAtTime(.8, t + du); }
      const bp = F('bandpass', 260, .7), g1 = G();
      bp.frequency.setValueAtTime(260, t); bp.frequency.exponentialRampToValueAtTime(2400, t + du * .7);
      env(g1.gain, t, [[du * .3, .35], [du * .65, .8], [du, 0]]); W(NZ(t, du + .05), bp, g1, p);
      const g2 = G(); env(g2.gain, t, [[du * .4, .5], [du * .6, .6], [du, 0]]); W(NZ(t, du + .05), F('lowpass', 220, .7), g2, p);
      const wn = OSC('triangle', 900, t, du + .05), g3 = G();
      wn.frequency.setValueAtTime(900, t); wn.frequency.exponentialRampToValueAtTime(2600, t + du * .75);
      env(g3.gain, t, [[du * .5, .03], [du * .7, .05], [du, 0]]); W(wn, g3, p);
      duck(t + .3, .55, du * .7);
    },
    /* 해상: 뱃고동 '부웅—' */
    horn(t, du = 1.1) {
      du /= SP;
      const d = bus(.45), lp = F('lowpass', 900, .8), g = G(), p = g.gain;
      p.setValueAtTime(0, t); p.linearRampToValueAtTime(.24, t + .12); p.setValueAtTime(.24, t + du - .05); p.linearRampToValueAtTime(0, t + du + .3);
      W(lp, g, d);
      for (const [f, a] of [[92.5, 1], [92.5 * 1.006, .8], [138.6, .45], [185, .3]]) { const os = OSC('sawtooth', f, t, du + .4); os.frequency.setValueAtTime(f * .97, t); os.frequency.linearRampToValueAtTime(f, t + .15); W(os, G(a), lp); }
      duck(t, .5, du);
    },
    /* 해상: 출렁이는 물결 */
    waves(t, du = 3.5) {
      du /= SP;
      const d = bus(.2), g = G(), am = G(.07);
      env(g.gain, t, [[.6, 1], [du - .6, 1], [du, 0]]);
      W(OSC('sine', .45, t, du + .1), G(.05), am.gain);
      W(NZ(t, du + .1), F('lowpass', 750, .6), am, g, d);
    },
    /* 육상: 트럭 엔진을 밟았다가 에어브레이크 '치익' */
    truck(t) {
      const k = 1 / SP, d = bus(.15), g = G(), os = OSC('sawtooth', 46, t, 1.8 * k), am = OSC('sine', 10, t, 1.8 * k), ab = G(.6);
      os.frequency.setValueAtTime(46, t); os.frequency.linearRampToValueAtTime(70, t + .9 * k); os.frequency.linearRampToValueAtTime(52, t + 1.4 * k);
      am.frequency.setValueAtTime(10, t); am.frequency.linearRampToValueAtTime(16, t + .9 * k); am.frequency.linearRampToValueAtTime(11, t + 1.4 * k);
      W(am, G(.4), ab.gain);
      env(g.gain, t, [[.25 * k, .55], [1.3 * k, .4], [1.7 * k, 0]]);
      W(os, F('lowpass', 420, 1.2), ab, g, d);
      const tb = t + 1.35 * k, g2 = G(), q = g2.gain; q.setValueAtTime(0, tb); q.linearRampToValueAtTime(.24, tb + .02); q.setTargetAtTime(0, tb + .05, .14);
      W(NZ(tb, .7), F('highpass', 2500, .6), g2, d);
      duck(t, .6, 1.6);
    },
    /* 통관: 서류에 도장 '쾅' */
    stamp(t) {
      const d = bus(.25), g0 = G(); hit(g0.gain, t - .07, .07, .001, .008); W(NZ(t - .07, .03), F('bandpass', 1800, 2), g0, d);
      const g = G(), os = OSC('sine', 125, t, .5);
      os.frequency.setValueAtTime(125, t); os.frequency.exponentialRampToValueAtTime(46, t + .15);
      hit(g.gain, t, .75, .002, .075); W(os, g, d);
      const g2 = G(); hit(g2.gain, t, .5, .001, .02); W(NZ(t, .2), F('lowpass', 1500, 1), g2, d);
      const g3 = G(); hit(g3.gain, t + .004, .2, .0005, .007); W(NZ(t + .004, .05), F('bandpass', 2800, .8), g3, d);
      duck(t, .55, .5);
    },
    /* 창고: 셔터가 '드르륵' 올라감 */
    shutter(t, du = .8) {
      du /= SP;
      const d = bus(.2, .25), g = G(), am = OSC('square', 22, t, du + .1), ab = G(.5);
      am.frequency.setValueAtTime(22, t); am.frequency.linearRampToValueAtTime(34, t + du);
      W(am, G(.5), ab.gain);
      env(g.gain, t, [[.06, .7], [du - .1, .7], [du, 0]]);
      W(NZ(t, du + .1), F('bandpass', 1500, 1.2), ab, g, d);
      const g2 = G(); hit(g2.gain, t + du - .02, .45, .002, .04); W(NZ(t + du - .02, .1), F('lowpass', 900, 1), g2, d);
      duck(t, .65, du);
    },
    /* 창고: 상자가 내려앉는 '툭' */
    thud(t) {
      const d = bus(.12), g = G(), os = OSC('sine', 175, t, .4);
      os.frequency.setValueAtTime(175, t); os.frequency.exponentialRampToValueAtTime(68, t + .1);
      hit(g.gain, t, .6, .003, .055); W(os, g, d);
      const g2 = G(); hit(g2.gain, t, .36, .002, .028); W(NZ(t, .15), F('lowpass', 1200, .9), g2, d);
      duck(t, .7, .3);
    },
    /* 창고: 지게차 후진 경고음 '삐-삐-삐' */
    forklift(t) {
      const d = bus(.25, .3), lp = F('lowpass', 2500, .7); W(lp, d);
      for (let i = 0; i < 3; i++) { const tt = t + i * .42 / SP, g = G(), p = g.gain; p.setValueAtTime(0, tt); p.linearRampToValueAtTime(.24, tt + .01); p.setValueAtTime(.24, tt + .21); p.linearRampToValueAtTime(0, tt + .23); W(OSC('square', 1040, tt, .25), g, lp); }
      duck(t, .7, 1.2);
    },
    /* 대화: 받은 메시지 '띠롱' / 보낸 메시지 '슝' */
    msgIn(t) { const d = bus(.2, -.3); ping(t, 1175, .4, .05, d); ping(t + .07, 1760, .36, .06, d); duck(t, .75, .4); },
    msgOut(t) {
      const d = bus(.2, .3), g = G(), os = OSC('sine', 600, t, .2);
      os.frequency.setValueAtTime(600, t); os.frequency.exponentialRampToValueAtTime(1180, t + .09);
      hit(g.gain, t, .48, .004, .05); W(os, g, d); duck(t, .75, .3);
    },
    /* 레이더: 탐색 '핑—' */
    sonar(t) { const d = bus(.6); ping(t, 1175, .27, .3, d); ping(t, 2350, .05, .08, d); duck(t, .8, .6); },
    /* 레이더: 인재 포착 '삐빅' */
    blip(t, i = 0) {
      const f = [1760, 1976, 2349][i % 3], d = bus(.25, [-.5, .5, -.2][i % 3]);
      ping(t, f, .25, .04, d); ping(t + .09, f, .18, .03, d); duck(t, .75, .3);
    },
    /* 레이더: 조준이 좁혀지며 빨라지는 경고음 → 고정 '띠링' */
    lock(t) {
      const d = bus(.2); let x = 0, gap = .2 / SP;
      while (x < 1.05 / SP) { ping(t + x, 2200, .16, .018, d, 'square'); x += gap; gap = Math.max(.05 / SP, gap * .78); }
      const tt = t + 1.1 / SP;
      [1175, 1480, 1760].forEach((f, i) => { ping(tt + i * .035, f, .22, .25, d); ping(tt + i * .035, f * 2, .05, .06, d); });
      duck(t, .6, 1.8);
    },
    /* 채용 절차: 단계마다 '딩' (한 단계씩 올라감) */
    check(t, i = 0) {
      const f = mtof([74, 78, 81, 86, 90][Math.min(i, 4)]), d = bus(.3, -.4 + i * .2);
      ping(t, f, .42, .09, d); ping(t, f * 2.756, .07, .03, d);
      const g = G(); hit(g.gain, t, .2, .001, .006); W(NZ(t, .03), F('bandpass', 3000, 2), g, d);
      duck(t, .75, .35);
    },
    /* 복리후생 태그가 붙을 때 '톡' */
    tag(t) { const d = bus(.15, R(-.4, .4)), g = G(), os = OSC('sine', 480, t, .2); os.frequency.setValueAtTime(480, t); os.frequency.exponentialRampToValueAtTime(960, t + .05); hit(g.gain, t, .3, .002, .035); W(os, g, d); },
    /* 마무리: '환영' 도장 + 작은 징(소라)의 올라가는 '징!' */
    seal(t) {
      RAW.stamp(t);
      const d = bus(.35), f0 = 760;
      [[1, 1, 1.1], [1.53, .45, .7], [2.21, .3, .5], [2.9, .18, .35]].forEach(([r, a, dec]) => {
        const os = OSC('sine', f0 * r * .94, t + .06, dec * 1.6 + .05), g = G();
        os.frequency.setValueAtTime(f0 * r * .94, t + .06); os.frequency.exponentialRampToValueAtTime(f0 * r * 1.03, t + .28);
        hit(g.gain, t + .06, .12 * a, .002, dec / 4.5); W(os, g, d);
      });
    },
    /* 장면 전환: 컨베이어처럼 밀려 들어오는 '쉭' */
    swish(t, dir) {
      const p = P(0), bp = F('bandpass', 1500, 1.1), g = G();
      if (p.pan) { p.pan.setValueAtTime(dir > 0 ? .5 : -.5, t); p.pan.linearRampToValueAtTime(dir > 0 ? -.5 : .5, t + .3 / SP); }
      bp.frequency.setValueAtTime(1500, t); bp.frequency.exponentialRampToValueAtTime(5200, t + .26 / SP);
      env(g.gain, t, [[.11 / SP, .1], [.3 / SP, 0]]);
      W(NZ(t, .32 / SP), bp, g, p, sfxB);
    },
    pop(t) {
      const d = bus(.2), g = G(), os = OSC('sine', 380, t, .25);
      os.frequency.setValueAtTime(380, t); os.frequency.exponentialRampToValueAtTime(900, t + .06);
      hit(g.gain, t, .25, .002, .04); W(os, g, d);
    }
  };
  const SFX = {};
  for (const k in RAW) SFX[k] = voice(RAW[k]);

  /* ── 화면 쪽에서 부르는 함수 ── */
  function scene(i, prev, dir, at) {
    if (!on || !ctx) return;
    const t = (at != null ? at : ctx.currentTime) + .02;
    if (i === 0 && (prev === last || !sess || sess.done)) newSess(t, true);
    else if ((!sess || sess.done) && i !== last) newSess(t, false);
    if (prev >= 0 && prev !== i) SFX.swish(t, dir);
    for (const [dt, name, a] of o.sfx[i] || []) (SFX[name] || SFX.pop)(t + dt / SP, a);
    run();
  }
  /* 일시정지·길게 누르기 상태를 음악에 반영 */
  function sync() {
    if (!ctx) return;
    const f = o.flags(), t = ctx.currentTime, k = f.paused ? 0 : f.held ? .55 : 1;
    bgmLvl.gain.setTargetAtTime(VOL.bgm * k, t, f.paused ? .15 : .1);
    bgmTone.frequency.setTargetAtTime(f.held ? 850 : 18000, t, .1);
    const s = sess;
    if (s && !s.done) {

  function start(fromTop) {
    if (!ctx) build();
    on = true; clearTimeout(offT);
    if (ctx.state !== 'running' && ctx.resume) ctx.resume();
    const z = ctx.createBufferSource(); z.buffer = ctx.createBuffer(1, 1, ctx.sampleRate); z.connect(ctx.destination); z.start(0);
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t); master.gain.setTargetAtTime(VOL.master, t, .1);
    if (fromTop) newSess(t + .02, true);

  }

    on = false;
    if (!ctx) return;

}
const snd = makeSound({
  speed: SPEED,
  lv: S.map(s => s.lv),
  sfx: S.map(s => s.sfx),
  flags: () => ({paused: userPaused, held}),
  sceneAt: ms => {
    if (cur < 0) return 0;
    if (!started || userPaused || held || document.hidden) return cur;
    let i = cur, rem = (S[i].dur - elapsed) / SPEED;
    while (ms > rem && i < S.length - 1) { ms -= rem; rem = S[++i].dur / SPEED; }
    return i;
  }
});

function syncBtn() {
  const end = cur === S.length - 1;
  btn.innerHTML = end ? ICON.replay : userPaused ? ICON.play : ICON.pause;
  btn.setAttribute('aria-label', end ? '처음부터 다시 보기' : userPaused ? '재생' : '일시정지');
}
function setPaused(v) { userPaused = v; stage.classList.toggle('paused', v); syncBtn(); if (snd) snd.sync(); }

function show(i, dir) {
  const prev = cur;
  S.forEach((s, k) => { if (k !== prev && k !== i) s.el.classList.remove('on', 'was', 'in', 'back'); });
  if (prev >= 0 && prev !== i) {
    const p = S[prev].el;
    p.classList.remove('on', 'in', 'back');
    p.classList.add('was');
    p.setAttribute('aria-hidden', 'true');
  }
  const el = S[i].el;
  el.classList.remove('on', 'was', 'in', 'back');
  void el.offsetWidth;
  el.classList.add('on', dir < 0 ? 'back' : 'in');
  if (SPEED !== 1 && el.getAnimations) for (const an of el.getAnimations({subtree: true})) an.playbackRate = SPEED;
  el.setAttribute('aria-hidden', 'false');
  cur = i; elapsed = 0;
  if (snd) snd.scene(i, prev, dir < 0 ? -1 : 1);
  clearTimeout(wasT);
  wasT = setTimeout(() => S.forEach((s, k) => { if (k !== cur) s.el.classList.remove('was'); }), 700 / SPEED);
  fills.forEach((f, k) => { f.style.transform = `scaleX(${k < cur ? 1 : 0})`; });
  syncBtn();
}
const go = (i, dir) => { if (i >= 0 && i < S.length) show(i, dir == null ? (i >= cur ? 1 : -1) : dir); };
const next = () => { if (cur < S.length - 1) go(cur + 1, 1); };
const prevScene = () => go(Math.max(0, cur - 1), -1);

function tick(t) {
  const dt = last ? Math.min(80, t - last) : 0;
  last = t;
  const s = S[cur];
  if (s) {
    if (s.dur === Infinity) fills[cur].style.transform = 'scaleX(1)';
    else {
      if (started && !userPaused && !held && !document.hidden) elapsed += dt * SPEED;
      fills[cur].style.transform = `scaleX(${Math.min(1, elapsed / s.dur).toFixed(4)})`;
      if (elapsed >= s.dur) next();
    }

  requestAnimationFrame(tick);
}

/* 탭: 오른쪽 다음·왼쪽 이전 / 스와이프 / 길게 눌러 멈춤 */
let down = null, holdT = 0, hintOff = false;
const killHint = () => { if (!hintOff) { hintOff = true; hint.classList.add('off'); } };
const release = () => { clearTimeout(holdT); if (held) { held = false; stage.classList.remove('held'); if (snd) snd.sync(); } down = null; };
stage.addEventListener('pointerdown', e => {
  if ((e.pointerType === 'mouse' && e.button !== 0) || e.target.closest('button, a')) return;
  down = {x: e.clientX, y: e.clientY};
  clearTimeout(holdT);
  holdT = setTimeout(() => { if (down) { held = true; stage.classList.add('held'); if (snd) snd.sync(); } }, 240);
});
stage.addEventListener('pointermove', e => {
  if (down && !held && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) clearTimeout(holdT);
});
stage.addEventListener('pointerup', e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y, wasHeld = held;
  release(); killHint();
  if (Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy) * 1.2) { if (dx < 0) next(); else prevScene(); return; }
  if (wasHeld || Math.hypot(dx, dy) > 10) return;
  const r = stage.getBoundingClientRect();
  if (e.clientX - r.left < r.width * .3) prevScene(); else next();
});
stage.addEventListener('pointercancel', release);
stage.addEventListener('contextmenu', e => e.preventDefault());

btn.addEventListener('click', () => { killHint(); if (cur === S.length - 1) { setPaused(false); go(0, 1); } else setPaused(!userPaused); });
stage.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && b.dataset.act === 'replay') { setPaused(false); go(0, 1); }
});
/* 소리 켜기·끄기 — 처음 켤 때는 음악과 장면이 맞게 처음부터 다시 시작합니다(마지막 장면에서는 그대로) */
const sbtn = $('#btnSnd');
let sndTried = false;
function syncSnd() {
  const v = !!(snd && snd.on), lab = v ? '소리 끄기' : '소리 켜기';
  sbtn.classList.toggle('cta', !v && !sndTried);
  sbtn.innerHTML = (v ? ICON.sndOn : ICON.sndOff) + '<span class="lbl">소리 켜기</span>';
  sbtn.setAttribute('aria-label', lab);
  sbtn.title = lab + ' (M)';
}
if (snd) {
  sbtn.hidden = false;
  syncSnd();
  sbtn.addEventListener('click', () => {
    killHint();
    const fromTop = !sndTried && cur !== S.length - 1;
    sndTried = true;
    snd.toggle(fromTop);
    if (fromTop && snd.on) { setPaused(false); go(0, 1); }
    syncSnd();
  });
}
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.code === 'KeyM' && snd && !e.repeat) { e.preventDefault(); sbtn.click(); return; }
  const tgt = e.target instanceof Element ? e.target : null;
  if (e.key === 'ArrowRight') { e.preventDefault(); killHint(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); killHint(); prevScene(); }
  else if (e.key === ' ' && !(tgt && tgt.closest('button, a'))) { e.preventDefault(); btn.click(); }
});

/* 화면 크기에 맞춰 장면 안 글자·도형 크기를 맞춤(넘치면 조금씩 줄임) */
function fitAll() {
  const base = innerWidth >= 1600 && innerHeight >= 900 ? 1.25 : 1;  /* 부스 TV처럼 큰 화면에서는 25% 크게 */
  S.forEach(s => {
    const f = s.el.querySelector('.fit');
    if (!f) return;
    let k = base;
    f.style.setProperty('--k', k);
    for (let n = 0; n < 16 && f.scrollHeight > f.clientHeight + 1; n++) { k -= .05; f.style.setProperty('--k', k.toFixed(2)); }
  });
}

hint.textContent = fine ? '클릭하거나 ← → 키로 넘깁니다' : '탭하면 다음, 길게 누르면 멈춤';
setTimeout(killHint, 8000);
const wait = ms => new Promise(r => setTimeout(r, ms));
const fontsP = document.fonts && document.fonts.load
  ? Promise.all([document.fonts.load('700 48px "IBM Plex Sans KR"', '중국과 세계 사이'), document.fonts.load('900 64px "Noto Serif SC"', '物流空运海运'), document.fonts.load('800 24px "Big Shoulders Stencil Display"', 'ECW 1998')]).catch(() => {})
  : Promise.resolve();
function start() {
  if (started) return;
  started = true;
  stage.classList.add('ready');
  fitAll();
  go(0, 1);
}
Promise.race([fontsP, wait(1500)]).then(start);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (started) fitAll(); });
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(fitAll, 120); });
syncBtn();
requestAnimationFrame(tick);
window.__show = {go: i => go(i, 1), pause: v => setPaused(v !== false)};
})();
